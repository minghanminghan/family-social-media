name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 6 days (e.g., Jan 1, Jan 7, Jan 13...)
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Allows you to manually trigger the ping from the GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive request to database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -I
